name: CI/CD - Pokémon API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Testes automatizados
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Instalar dependências
        run: poetry install --with dev --no-root

      - name: Executar testes e verificar cobertura
        run: poetry run pytest --cov=app --cov-report=term-missing

  deploy:
    name: Deploy na Vercel
    runs-on: ubuntu-latest
    needs: tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Obter configurações de produção
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Construir aplicação
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Publicar na Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
